version: 2
# Every ecosystem is grouped (`patterns: ["*"]`) so each weekly run opens ONE PR
# per ecosystem instead of one PR per dependency. Python uses the `uv`
# ecosystem, not `pip`: `pip` bumped pyproject pins without relocking uv.lock,
# so its PRs were never installed or tested under the locked environment.
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - python
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - github-actions
