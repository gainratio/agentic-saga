version: 2
# One grouped PR per ecosystem per month (`patterns: ["*"]`), minor and patch only.
# Semver-major updates are ignored on purpose: majors are migrated by hand, in a
# human-written PR, because they are where real breakage lives.
# Python uses the `uv` ecosystem, not `pip`: `pip` bumped pyproject pins without
# relocking uv.lock, so its PRs were never installed or tested under the lock.
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - python
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - github-actions
