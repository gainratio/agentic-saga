version: 2
# One grouped PR per ecosystem per month (`patterns: ["*"]`), minor and patch only.
# Semver-major updates are ignored on purpose: majors are migrated by hand, in a
# human-written PR, because they are where real breakage lives.
# Python uses the `uv` ecosystem, not `pip`: `pip` bumped pyproject pins without
# relocking uv.lock, so its PRs were never installed or tested under the lock.
updates:
  - package-ecosystem: uv
    directory: "/"
    # The Dagger module's SDK is generated and gitignored, so its path dependency
    # (`dagger-io` at .dagger/sdk) is not retrievable by the updater.
    exclude-paths:
      - ".dagger/**"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # openrouter (every release through 1.3.57) requires pydantic<2.13, so a pydantic
      # 2.13+ bump can never resolve and failed the whole uv job on 2026-10-14. Remove
      # this once openrouter allows pydantic 2.13.
      - dependency-name: "pydantic"
        versions: [">=2.13"]
    labels:
      - dependencies
      - python
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - github-actions
